<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0c0e11;
        --ink: #eef1f4;
        --quiet: #a4adb7;
        --mint: #5fe0c4;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <div id="ground" class="clip" data-start="0" data-duration="16" data-track-index="0"></div>

      <div id="demo" data-composition-id="demo" data-composition-src="compositions/demo.html"
        data-start="2.15" data-duration="10.5" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="2.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="12.15" data-duration="3.85" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
